name: ECOS 한국 금리 받기

on:
  schedule:
    # GitHub 예약 실행은 붐비는 시각(정각·30분)에 1~3시간씩 늦게 돌기도 해서, 일찍·어중간한 분으로 두 번 돌린다.
    - cron: "17 18 * * *"   # 한국시간 03:17 (늦어져도 09:20 금리 예약 작업 전에 끝나도록)
    - cron: "47 21 * * *"   # 한국시간 06:47 (보조)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ECOS 호출
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python scripts/fetch_ecos.py
      - name: 한국 물가지수 (ECOS 월별)
        continue-on-error: true
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python scripts/fetch_prices.py
      - name: 바뀌었으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecos.json
          [ -f prices.json ] && git add prices.json
          git diff --cached --quiet || git commit -m "ECOS 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
