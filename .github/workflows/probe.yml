name: probe (임시)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          set +e; exec > probe.txt 2>&1
          for st in 901Y010 901Y009; do echo "== $st"; curl -sS -m 60 "https://ecos.bok.or.kr/api/StatisticItemList/$ECOS_KEY/json/kr/1/2000/$st" | python3 -c "
          import json,sys; d=json.load(sys.stdin); rows=d.get('StatisticItemList',{}).get('row',[]); print(len(rows), d.get('RESULT'))
          [print(r['ITEM_CODE'],r['ITEM_NAME'],r.get('CYCLE')) for r in rows if r.get('CYCLE')=='M'][:60]"; done
      - if: always()
        run: |
          sed -i "s/${{ secrets.ECOS_KEY }}/KEY/g" probe.txt || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe.txt; git commit -m probe; git push
