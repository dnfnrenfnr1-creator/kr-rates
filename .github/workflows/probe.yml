name: probe (임시)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e; exec > probe.txt 2>&1
          for u in "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL&cosd=2025-01-01" "https://fred.stlouisfed.org/data/CPIAUCSL.txt" "https://alfred.stlouisfed.org/graph/alfredgraph.csv?id=CPIAUCSL&cosd=2025-01-01"; do
            for opt in "--http1.1" "--http2"; do
              echo "== $opt $u"; curl -sS $opt -m 90 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36" -H "Accept: text/csv,text/plain,*/*" -o out.txt -w "%{http_code} %{time_total}s\n" "$u"; head -c 200 out.txt | tr '\n' ' '; echo; done; done
          echo "== BLS v1"; curl -sS --http1.1 -m 60 -A "kr-rates-github-action/1.0" -H "Content-Type: application/json" -d '{"seriesid":["CUSR0000SA0"],"startyear":"2025","endyear":"2026"}' -o out.txt -w "%{http_code}\n" https://api.bls.gov/publicAPI/v1/timeseries/data/; head -c 300 out.txt; echo
      - if: always()
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add probe.txt; git commit -m probe; git push
